services:
  mysql-service:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      #MYSQL_USER: root
      #MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
  core-api:
    image: core-api:0.0.1
    container_name: core-api
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./services/core-api:/app
      #- core_node_modules:/app/node_modules
    ports:
      - 3000:3000
    networks:
      - app-network
  easy-pdf:
    image: easy-pdf-generator:0.1.0
    container_name: easy-pdf
    restart: unless-stopped
    environment:
      MIN_POOL: ${MIN_POOL}
      MAX_POOL: ${MAX_POOL}
      ATM: ${ATM}
      ITM: ${ITM}
      SERVER_PORT: ${SERVER_PORT}
    ports:
      - ${DOCKER_PORTS}
    networks:
      - app-network

volumes:
  db_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./data/mysql" # Pasta que será criada no seu diretório atual

  #core_node_modules:

networks:
  app-network:
    driver: bridge
