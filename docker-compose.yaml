services:
  mysql-service:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - ${DOCKER_DB_PORTS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
  core-api:
    image: core-api:0.0.1
    container_name: core-api
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      PDF_HOST: ${PDF_HOST} 
      TRANSLATION_DEV_URL: ${TRANSLATION_DEV_URL}
      DEV: ${DEV}
      CACHE_PATH: ${CACHE_PATH}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE: ${DATABASE}
      API_PORT: ${API_PORT}
      API_HOST: ${API_HOST}
    volumes:
      - ./services/core-api:/app
      #- core_node_modules:/app/node_modules
    ports:
      - ${DOCKER_CORE_API_PORTS}
    networks:
      - app-network
  easy-pdf:
    image: easy-pdf-generator:0.1.0
    container_name: easy-pdf
    restart: unless-stopped
    environment:
      MIN_POOL: ${MIN_POOL}
      MAX_POOL: ${MAX_POOL}
      ATM: ${ATM}
      ITM: ${ITM}
      PDF_SERVER_PORT: ${PDF_SERVER_PORT}
    ports:
      - ${DOCKER_PDF_PORTS}
    networks:
      - app-network

volumes:
  db_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./data/mysql" # Pasta que será criada no seu diretório atual

  #core_node_modules:

networks:
  app-network:
    driver: bridge
